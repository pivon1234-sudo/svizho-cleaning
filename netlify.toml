# Налаштування Netlify.
# Сторінки збираються з шаблонів src/ і даних content/ скриптом build.js
# (без залежностей) у папку dist/, яка й публікується.
# Після підключення репозиторію GitHub кожен push у гілку main
# автоматично публікує сайт, а кожен Pull Request отримує preview-адресу.

[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Заголовки безпеки
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Кеш для статики (CSS/JS/SVG). HTML не кешуємо, щоб правки було видно одразу.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Конфіг адмінки завжди свіжий
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"

# Красиві адреси: /thanks замість /thanks.html
[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200
